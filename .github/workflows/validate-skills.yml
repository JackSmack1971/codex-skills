name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/compile_skill_registry.py --check
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_skill_packages.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_core_benchmark.py --deterministic-only
      - run: python scripts/validate_routing_benchmark.py
      - run: python -m unittest discover -s tests -p "test_routing_*.py" -v
