name: Experimental routing evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  live-routing:
    name: Experimental live Codex routing measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run live routing probe
        continue-on-error: true
        run: python scripts/run_codex_evaluation.py --live

      - name: Analyze routing result
        if: always()
        run: >-
          python scripts/analyze_routing_results.py
          evals/codex/results/latest.json
          --json-out evals/codex/results/routing-report.json
          --markdown-out evals/codex/results/routing-report.md

      - name: Compare compatible baseline when present
        if: always() && hashFiles('benchmarks/routing/baseline.json') != ''
        continue-on-error: true
        run: >-
          python scripts/compare_routing_baseline.py create
          evals/codex/results/latest.json
          --output evals/codex/results/routing-candidate-baseline.json
          && python scripts/compare_routing_baseline.py compare
          benchmarks/routing/baseline.json
          evals/codex/results/routing-candidate-baseline.json
          --output evals/codex/results/routing-baseline-comparison.json

      - name: Surface live status
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path("evals/codex/results/latest.json").read_text())
          status = result.get("result", {}).get("status", "UNAVAILABLE")
          if status in {"ROUTING_FAIL", "RUNTIME_FAILURE"}:
              print(f"::error title=Routing regression::Live routing evaluation returned {status}")
              sys.exit(1)
          print(f"Live routing evaluation: {status}; experimental measurement, not deterministic validation.")
          PY

      - name: Upload metadata-only routing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-evaluation-${{ github.run_id }}
          path: evals/codex/results/
          if-no-files-found: error
          retention-days: 14
