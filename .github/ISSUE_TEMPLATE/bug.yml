name: Bug report
description: Report a reproducible problem in a skill or repository workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest prompt, command, or file state that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the relevant branch, commit, runtime, and tool versions.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List checks already run and attach useful logs or links.
